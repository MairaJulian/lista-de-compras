<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Invitar al hogar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
a:focus-visible,button:focus-visible{outline:3px solid #2E7D57;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F7F8F3;font-family:'DM Sans',system-ui,sans-serif;color:#1C2621;display:flex;flex-direction:column;position:relative;overflow:hidden">
  <div style="padding:48px 16px 0 8px;display:flex;align-items:center;gap:4px">
    <a href="Hogar.dc.html" aria-label="Volver a Hogar" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin:0;font-family:Nunito,sans-serif;font-weight:800;font-size:24px">Invitar</h1>
  </div>

  <div style="padding:16px 24px 0;display:flex;flex-direction:column;gap:6px">
    <h2 style="margin:0;font-family:Nunito,sans-serif;font-weight:800;font-size:24px;line-height:1.2;text-wrap:balance">Sumá a alguien a Nuestra casa</h2>
    <p style="margin:0;font-size:15px;line-height:1.5;color:#5B675F;text-wrap:pretty">Pasale el enlace o el código. Se une con su cuenta de Google.</p>
  </div>

  <div style="margin:20px 24px 0;padding:14px 16px;border-radius:20px;background:#fff;display:flex;flex-direction:column;gap:8px">
    <div id="lbl-enlace" style="font-size:13px;font-weight:700;color:#5B675F">Enlace</div>
    <div role="group" aria-labelledby="lbl-enlace" style="display:flex;align-items:center;gap:8px">
      <span style="flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">[enlace de invitación]</span>
      <button onClick="{{ copyLink }}" style="height:44px;padding:0 16px;border:0;border-radius:22px;background:#E3F1E8;color:#1F5C3E;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;flex:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>
        {{ linkLabel }}
      </button>
    </div>
  </div>

  <div style="margin:12px 24px 0;padding:14px 16px;border-radius:20px;background:#fff;display:flex;flex-direction:column;gap:8px">
    <div id="lbl-codigo" style="font-size:13px;font-weight:700;color:#5B675F">Código</div>
    <div role="group" aria-labelledby="lbl-codigo" style="display:flex;align-items:center;gap:8px">
      <span style="flex:1;min-width:0;font-family:Nunito,sans-serif;font-weight:800;font-size:24px;letter-spacing:0.5px;white-space:nowrap">{{ code }}</span>
      <button onClick="{{ copyCode }}" style="height:44px;padding:0 16px;border:0;border-radius:22px;background:#E3F1E8;color:#1F5C3E;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;flex:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>
        {{ codeLabel }}
      </button>
    </div>
  </div>

  <div style="margin:12px 24px 0;display:flex;align-items:center;gap:8px;color:#3F4A44;font-size:14px;font-weight:700">
    <span style="height:32px;padding:0 12px 0 10px;border-radius:16px;background:#ECEEE8;display:flex;align-items:center;gap:6px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      {{ expires }}
    </span>
    <span style="font-weight:400;color:#5B675F">Funciona con el enlace y con el código.</span>
  </div>

  <div style="flex:1"></div>

  <div style="padding:0 24px 32px;display:flex;flex-direction:column;gap:10px">
    <a href="Hogar.dc.html" style="height:56px;border-radius:28px;background:#2E7D57;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></svg>
      Compartir enlace
    </a>
    <button onClick="{{ regenerate }}" style="height:52px;border:1.5px solid #D5DAD0;border-radius:26px;background:#fff;color:#1C2621;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg>
      Generar enlace nuevo
    </button>
    <a href="DesactivarEnlace.dc.html" style="height:52px;box-sizing:border-box;border:1.5px solid #D5DAD0;border-radius:26px;color:#A12D2D;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center">Desactivar enlace</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(...args) {
super(...args);
this.state = { fresh: false, copiedLink: false, copiedCode: false };
}
renderVals() {
const s = this.state;
return {
code: s.fresh ? 'R4WD-3ZT-8HC' : 'K7P2-9XQ-4MN',
expires: s.fresh ? 'Vence en 48 h' : 'Vence en 47 h',
linkLabel: s.copiedLink ? 'Copiado' : 'Copiar',
codeLabel: s.copiedCode ? 'Copiado' : 'Copiar',
copyLink: () => this.setState({ copiedLink: !this.state.copiedLink }),
copyCode: () => this.setState({ copiedCode: !this.state.copiedCode }),
regenerate: () => this.setState({ fresh: !this.state.fresh, copiedLink: false, copiedCode: false })
};
}
}
</script>
</body>
</html>
