<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear otro grupo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
input::placeholder{color:#5B675F;opacity:1}
@keyframes subir{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes velo{from{opacity:0}to{opacity:1}}
@keyframes aparecer{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #2E7D57;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F7F8F3;font-family:'DM Sans',system-ui,sans-serif;color:#1C2621;display:flex;flex-direction:column;position:relative;overflow:hidden">
  <div style="padding:48px 16px 0 8px;display:flex;align-items:center;gap:4px">
    <a href="CambiarGrupo.dc.html" aria-label="Volver" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin:0;font-family:Nunito,sans-serif;font-weight:800;font-size:24px">Crear otro grupo</h1>
  </div>

  <div style="padding:24px 28px 0;display:flex;flex-direction:column;gap:8px">
    <h2 style="margin:0;font-family:Nunito,sans-serif;font-weight:800;font-size:26px;line-height:1.2;text-wrap:balance">¿Cómo se llama el grupo?</h2>
    <p style="margin:0;font-size:16px;line-height:1.5;color:#5B675F;text-wrap:pretty">Lo van a ver todas las personas que invites. Seguís en tus otros grupos.</p>
  </div>
  <div style="margin:24px 24px 0;display:flex;flex-direction:column;gap:8px">
    <label for="nombre-grupo" style="font-size:13px;font-weight:700;color:#5B675F">Nombre del grupo</label>
    <input id="nombre-grupo" type="text" value="{{ name }}" onInput="{{ onName }}" placeholder="Por ejemplo: Juntada del sábado" autocomplete="off" style="height:60px;box-sizing:border-box;padding:0 18px;border:1.5px solid #D5DAD0;border-radius:18px;background:#fff;font-family:inherit;font-size:18px;font-weight:500;color:#1C2621">
  </div>
  <div style="margin:22px 24px 0">
    <div id="lbl-tipo" style="font-size:13px;font-weight:700;color:#5B675F;margin-bottom:8px">¿Qué tipo de grupo es?</div>
    <div role="group" aria-labelledby="lbl-tipo" style="display:flex;gap:10px">
      <button type="button" onClick="{{ pickFam }}" aria-pressed="{{ isFam }}" style="flex:1;height:84px;border-radius:20px;border:2px solid {{ bdFam }};background:{{ bgFam }};color:#2E7D57;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><span style="font-size:14px;font-weight:700;color:#1C2621">Familia</span></button><button type="button" onClick="{{ pickAmi }}" aria-pressed="{{ isAmi }}" style="flex:1;height:84px;border-radius:20px;border:2px solid {{ bdAmi }};background:{{ bgAmi }};color:#1D4E75;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14.5c2.5.3 4 2 4.5 5"/></svg><span style="font-size:14px;font-weight:700;color:#1C2621">Amigos</span></button><button type="button" onClick="{{ pickEve }}" aria-pressed="{{ isEve }}" style="flex:1;height:84px;border-radius:20px;border:2px solid {{ bdEve }};background:{{ bgEve }};color:#7A4300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 14h18M12 9C11 4.5 6.5 4.5 7 7.5 7.3 9 10 9 12 9zm0 0c1-4.5 5.5-4.5 5-1.5C16.7 9 14 9 12 9z"/></svg><span style="font-size:14px;font-weight:700;color:#1C2621">Evento</span></button>
    </div>
    <p style="margin:10px 4px 0;font-size:14px;line-height:1.45;color:#5B675F;min-height:40px">{{ hint }}</p>
  </div>
  <div style="flex:1"></div>
  <div style="padding:0 24px 40px">
    <sc-if value="{{ hasName }}" hint-placeholder-val="{{ true }}">
      <a href="HogarCreado.dc.html" style="height:56px;border-radius:28px;background:#2E7D57;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">Crear grupo</a>
    </sc-if>
    <sc-if value="{{ noName }}" hint-placeholder-val="{{ false }}">
      <button disabled style="width:100%;height:56px;border:0;border-radius:28px;background:#E4E8DF;color:#5B675F;font-size:17px;font-weight:700">Crear grupo</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(...args) {
super(...args);
this.state = { name: 'Juntada del sábado', tipo: 'Ami' };
}
renderVals() {
const { name, tipo } = this.state;
const has = name.trim().length > 0;
const colors = { Fam: '#E3F1E8', Ami: '#DDEBF7', Eve: '#FCEBCB' };
const dark = { Fam: '#2E7D57', Ami: '#1D4E75', Eve: '#7A4300' };
const out = { name, hasName: has, noName: !has,
onName: (e) => this.setState({ name: e.target.value }),
hint: tipo === 'Eve' ? 'Cuando termine el evento, podés archivar el grupo y queda en solo lectura.' : 'El tipo solo cambia el color y el ícono del grupo.' };
['Fam', 'Ami', 'Eve'].forEach((k) => {
out['is' + k] = tipo === k ? 'true' : 'false';
out['bg' + k] = tipo === k ? colors[k] : '#fff';
out['bd' + k] = tipo === k ? dark[k] : '#D5DAD0';
out['pick' + k] = () => this.setState({ tipo: k });
});
return out;
}
}
</script>
</body>
</html>
