<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Renombrar lista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
@keyframes subir{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes velo{from{opacity:0}to{opacity:1}}
@keyframes aparecer{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #2E7D57;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F7F8F3;font-family:'DM Sans',system-ui,sans-serif;color:#1C2621;position:relative;overflow:hidden;">
  <div aria-hidden="true" style="position:absolute;inset:0;display:flex;flex-direction:column">
    <div style="padding:48px 12px 0 4px;display:flex;align-items:center;gap:2px">
      <span style="width:44px;height:48px;display:flex;align-items:center;justify-content:center;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span>
      <div style="flex:1;min-width:0;margin-left:2px"><div style="font-family:Nunito,sans-serif;font-weight:800;font-size:22px;line-height:1.1;white-space:nowrap">Supermercado</div><div style="font-size:13px;color:#5B675F;margin-top:2px">Nuestra casa</div></div>
      <span style="height:40px;padding:0 10px 0 8px;border-radius:20px;background:#E3F1E8;color:#1F5C3E;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 1 1 .8-8.9A6 6 0 0 1 19 11.5 3.3 3.3 0 0 1 18 18z"/><path d="M9.5 13.5l2 2 3.5-4"/></svg>Sincronizado</span>
      <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;color:#3F4A44;"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></span>
    </div>
    <div style="margin:14px 20px 8px;display:flex;align-items:center;gap:10px"><div style="flex:1;height:52px;box-sizing:border-box;padding:0 20px;border:1.5px solid #D5DAD0;border-radius:26px;background:#fff;display:flex;align-items:center;font-size:17px;color:#5B675F">Agregar ítem…</div><span style="width:52px;height:52px;border-radius:50%;background:#2E7D57"></span></div>
    <div style="padding:4px 20px"><div style="padding:8px 4px;font-size:15px;font-weight:700">Pendientes <span style="color:#5B675F">7</span></div>
    <div style="border-radius:20px;overflow:hidden;background:#EEF1EA;display:flex;flex-direction:column;gap:1px"><div style="height:56px;padding:0 16px 0 6px;background:#fff;display:flex;align-items:center;gap:4px"><span style="width:44px;display:flex;justify-content:center;flex:none"><span style="width:24px;height:24px;border-radius:50%;border:2px solid #7C8A82;box-sizing:border-box"></span></span><span style="flex:1;font-size:17px;font-weight:500">Leche</span><span style="font-size:14px;color:#5B675F;margin-right:8px">×2</span><span style="width:28px;height:28px;border-radius:50%;background:#F8DDAE;color:#7A4300;font:800 13px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">L</span></div><div style="height:56px;padding:0 16px 0 6px;background:#fff;display:flex;align-items:center;gap:4px"><span style="width:44px;display:flex;justify-content:center;flex:none"><span style="width:24px;height:24px;border-radius:50%;border:2px solid #7C8A82;box-sizing:border-box"></span></span><span style="flex:1;font-size:17px;font-weight:500">Pan lactal</span><span style="font-size:14px;color:#5B675F;margin-right:8px"></span><span style="width:28px;height:28px;border-radius:50%;background:#CFE8D9;color:#1F5C3E;font:800 13px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">V</span></div><div style="height:56px;padding:0 16px 0 6px;background:#fff;display:flex;align-items:center;gap:4px"><span style="width:44px;display:flex;justify-content:center;flex:none"><span style="width:24px;height:24px;border-radius:50%;border:2px solid #7C8A82;box-sizing:border-box"></span></span><span style="flex:1;font-size:17px;font-weight:500">Yerba mate</span><span style="font-size:14px;color:#5B675F;margin-right:8px">1 kg</span><span style="width:28px;height:28px;border-radius:50%;background:#CFE8D9;color:#1F5C3E;font:800 13px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">V</span></div><div style="height:56px;padding:0 16px 0 6px;background:#fff;display:flex;align-items:center;gap:4px"><span style="width:44px;display:flex;justify-content:center;flex:none"><span style="width:24px;height:24px;border-radius:50%;border:2px solid #7C8A82;box-sizing:border-box"></span></span><span style="flex:1;font-size:17px;font-weight:500">Huevos</span><span style="font-size:14px;color:#5B675F;margin-right:8px">1 docena</span><span style="width:28px;height:28px;border-radius:50%;background:#CFE0F2;color:#1D4E75;font:800 13px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">D</span></div><div style="height:56px;padding:0 16px 0 6px;background:#fff;display:flex;align-items:center;gap:4px"><span style="width:44px;display:flex;justify-content:center;flex:none"><span style="width:24px;height:24px;border-radius:50%;border:2px solid #7C8A82;box-sizing:border-box"></span></span><span style="flex:1;font-size:17px;font-weight:500">Fideos</span><span style="font-size:14px;color:#5B675F;margin-right:8px">×3</span><span style="width:28px;height:28px;border-radius:50%;background:#F8DDAE;color:#7A4300;font:800 13px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">L</span></div><div style="height:56px;padding:0 16px 0 6px;background:#fff;display:flex;align-items:center;gap:4px"><span style="width:44px;display:flex;justify-content:center;flex:none"><span style="width:24px;height:24px;border-radius:50%;border:2px solid #7C8A82;box-sizing:border-box"></span></span><span style="flex:1;font-size:17px;font-weight:500">Aceite de girasol</span><span style="font-size:14px;color:#5B675F;margin-right:8px"></span><span style="width:28px;height:28px;border-radius:50%;background:#CFE0F2;color:#1D4E75;font:800 13px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">D</span></div></div></div>
  </div>

  <a href="Lista.dc.html" aria-label="Cerrar" style="position:absolute;inset:0;background:rgba(28,38,33,0.5);animation:velo 0.25s ease-out both"></a>
  <div role="dialog" aria-labelledby="titulo-renombrar" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:0 24px 28px;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -8px 30px rgba(28,38,33,0.18);animation:subir 0.35s cubic-bezier(0.2,0.8,0.2,1) both;display:flex;flex-direction:column">
    <div style="width:36px;height:4px;border-radius:2px;background:#C9D0C9;margin:10px auto 14px"></div>
    <h1 id="titulo-renombrar" style="margin:0;font-family:Nunito,sans-serif;font-weight:800;font-size:22px;line-height:1.2">Nombre de la lista</h1>
    <p style="margin:6px 0 0;font-size:15px;line-height:1.45;color:#5B675F">Ahora se llama <strong style="color:#1C2621">Supermercado</strong>. Lo ven todas las personas del hogar.</p>
    <div style="margin-top:18px;display:flex;flex-direction:column;gap:8px">
      <label for="nombre-lista" style="font-size:13px;font-weight:700;color:#5B675F">Nuevo nombre</label>
      <input id="nombre-lista" type="text" value="{{ name }}" onInput="{{ onName }}" placeholder="Nombre de la lista" autocomplete="off" style="height:60px;box-sizing:border-box;padding:0 18px;border:2px solid #2E7D57;border-radius:18px;background:#fff;font-family:inherit;font-size:18px;font-weight:500;color:#1C2621">
    </div>
    <div style="margin-top:22px;display:flex;flex-direction:column;gap:10px">
      <sc-if value="{{ canSave }}" hint-placeholder-val="{{ true }}">
        <a href="Lista.dc.html" style="height:56px;border-radius:28px;background:#2E7D57;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">Guardar</a>
      </sc-if>
      <sc-if value="{{ cannotSave }}" hint-placeholder-val="{{ false }}">
        <button disabled style="width:100%;height:56px;border:0;border-radius:28px;background:#E4E8DF;color:#5B675F;font-size:17px;font-weight:700">Guardar</button>
      </sc-if>
      <a href="Lista.dc.html" style="height:52px;box-sizing:border-box;border:1.5px solid #D5DAD0;border-radius:26px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center">Cancelar</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(...args) {
super(...args);
this.state = { name: 'Supermercado' };
}
renderVals() {
const name = this.state.name;
const has = name.trim().length > 0;
return {
name,
canSave: has,
cannotSave: !has,
onName: (e) => this.setState({ name: e.target.value })
};
}
}
</script>
</body>
</html>
