<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editar nombre del hogar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
@keyframes subir{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes velo{from{opacity:0}to{opacity:1}}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #2E7D57;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F7F8F3;font-family:'DM Sans',system-ui,sans-serif;color:#1C2621;position:relative;overflow:hidden">

  <div aria-hidden="true" style="position:absolute;inset:0;display:flex;flex-direction:column">
    <div style="padding:56px 24px 8px"><div style="font-family:Nunito,sans-serif;font-weight:800;font-size:34px;line-height:1.1">Hogar</div></div>
    <div style="margin:12px 24px 0;padding:20px;border-radius:24px;background:#E3F1E8;display:flex;align-items:center;gap:16px">
      <span style="width:56px;height:56px;border-radius:16px;background:#2E7D57;color:#fff;display:flex;align-items:center;justify-content:center;flex:none"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg></span>
      <div style="flex:1">
        <div style="font-family:Nunito,sans-serif;font-weight:800;font-size:22px;line-height:1.1">Nuestra casa</div>
        <div style="font-size:14px;color:#1F5C3E;margin-top:4px">3 miembros</div>
      </div>
      <span style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.7);color:#1F5C3E;display:flex;align-items:center;justify-content:center;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14 8l3 3"/></svg></span>
    </div>
    <div style="margin:28px 24px 10px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:15px;font-weight:700">Miembros</div>
      <span style="height:44px;padding:0 18px 0 14px;border-radius:22px;background:#2E7D57;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M19 8v6M16 11h6"/></svg>Invitar</span>
    </div>
    <div style="margin:0 24px;border-radius:20px;overflow:hidden;background:#EEF1EA;display:flex;flex-direction:column;gap:1px">
      <div style="height:72px;padding:0 8px 0 16px;background:#fff;display:flex;align-items:center;gap:14px">
        <span style="width:44px;height:44px;border-radius:50%;background:#CFE8D9;color:#1F5C3E;font:800 18px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">V</span>
        <div style="flex:1"><div style="font-size:17px;font-weight:700">Vos</div><div style="font-size:14px;color:#5B675F;margin-top:2px">Creaste el hogar</div></div>
      </div>
      <div style="height:72px;padding:0 8px 0 16px;background:#fff;display:flex;align-items:center;gap:14px">
        <span style="width:44px;height:44px;border-radius:50%;background:#F8DDAE;color:#7A4300;font:800 18px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">L</span>
        <div style="flex:1"><div style="font-size:17px;font-weight:700">Lucía</div><div style="font-size:14px;color:#5B675F;margin-top:2px">Miembro</div></div>
      </div>
      <div style="height:72px;padding:0 8px 0 16px;background:#fff;display:flex;align-items:center;gap:14px">
        <span style="width:44px;height:44px;border-radius:50%;background:#CFE0F2;color:#1D4E75;font:800 18px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">D</span>
        <div style="flex:1"><div style="font-size:17px;font-weight:700">Diego</div><div style="font-size:14px;color:#5B675F;margin-top:2px">Miembro</div></div>
      </div>
    </div>
  </div>

  <a href="Hogar.dc.html" aria-label="Cerrar" style="position:absolute;inset:0;background:rgba(28,38,33,0.5);animation:velo 0.25s ease-out both"></a>

  <div role="dialog" aria-labelledby="titulo-editar" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:0 24px 28px;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -8px 30px rgba(28,38,33,0.18);animation:subir 0.35s cubic-bezier(0.2,0.8,0.2,1) both;display:flex;flex-direction:column">
    <div style="width:36px;height:4px;border-radius:2px;background:#C9D0C9;margin:10px auto 14px"></div>
    <h1 id="titulo-editar" style="margin:0;font-family:Nunito,sans-serif;font-weight:800;font-size:22px;line-height:1.2">Nombre del hogar</h1>
    <p style="margin:6px 0 0;font-size:15px;line-height:1.45;color:#5B675F">Ahora se llama <strong style="color:#1C2621">Nuestra casa</strong>. Lo ven todas las personas del hogar.</p>
    <div style="margin-top:18px;display:flex;flex-direction:column;gap:8px">
      <label for="nombre-editar" style="font-size:13px;font-weight:700;color:#5B675F">Nuevo nombre</label>
      <input id="nombre-editar" type="text" value="{{ name }}" onInput="{{ onName }}" placeholder="Nombre del hogar" autocomplete="off" style="height:60px;box-sizing:border-box;padding:0 18px;border:2px solid #2E7D57;border-radius:18px;background:#fff;font-family:inherit;font-size:18px;font-weight:500;color:#1C2621">
    </div>
    <div style="margin-top:22px;display:flex;flex-direction:column;gap:10px">
      <sc-if value="{{ canSave }}" hint-placeholder-val="{{ true }}">
        <a href="Hogar.dc.html" style="height:56px;border-radius:28px;background:#2E7D57;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">Guardar</a>
      </sc-if>
      <sc-if value="{{ cannotSave }}" hint-placeholder-val="{{ false }}">
        <button disabled style="width:100%;height:56px;border:0;border-radius:28px;background:#E4E8DF;color:#5B675F;font-size:17px;font-weight:700">Guardar</button>
      </sc-if>
      <a href="Hogar.dc.html" style="height:52px;box-sizing:border-box;border:1.5px solid #D5DAD0;border-radius:26px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center">Cancelar</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(...args) {
super(...args);
this.state = { name: 'Nuestra casa' };
}
renderVals() {
const name = this.state.name;
const has = name.trim().length > 0;
return {
name,
canSave: has,
cannotSave: !has,
onName: (e) => this.setState({ name: e.target.value })
};
}
}
</script>
</body>
</html>
