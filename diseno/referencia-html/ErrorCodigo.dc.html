<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Error: código de invitación</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
input::placeholder{color:#5B675F;opacity:1}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #2E7D57;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F7F8F3;font-family:'DM Sans',system-ui,sans-serif;color:#1C2621;display:flex;flex-direction:column;position:relative;overflow:hidden">
  <div style="padding:48px 16px 0 8px;display:flex;align-items:center;gap:4px">
    <a href="SinHogar.dc.html" aria-label="Volver" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin:0;font-family:Nunito,sans-serif;font-weight:800;font-size:24px">Unirme con un código</h1>
  </div>

  <div style="padding:40px 32px 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px">
    <span style="width:104px;height:104px;border-radius:50%;background:#E3F1E8;color:#2E7D57;display:flex;align-items:center;justify-content:center;margin-bottom:8px">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></svg>
    </span>
    <h2 style="margin:0;font-family:Nunito,sans-serif;font-weight:800;font-size:26px;line-height:1.2;text-wrap:balance">Escribí o pegá tu código</h2>
    <p style="margin:0;font-size:16px;line-height:1.5;color:#5B675F;text-wrap:pretty">Te lo pasó quien creó el hogar. Tiene letras y números.</p>
  </div>

  <div style="margin:32px 24px 0;display:flex;flex-direction:column;gap:8px">
    <label for="codigo" style="font-size:13px;font-weight:700;color:{{ labelColor }}">Código de invitación</label>
    <div style="display:flex;align-items:center;gap:8px;height:64px;box-sizing:border-box;padding:0 8px 0 18px;border:{{ border }};border-radius:18px;background:{{ fieldBg }}">
      <input id="codigo" type="text" value="{{ code }}" onInput="{{ onCode }}" placeholder="K7P2-9XQ-4MN" autocomplete="off" autocapitalize="characters" aria-invalid="{{ invalid }}" aria-describedby="error-codigo" style="flex:1;min-width:0;border:0;background:transparent;font-family:Nunito,sans-serif;font-weight:800;font-size:22px;letter-spacing:1px;text-transform:uppercase;color:#1C2621">
      <button onClick="{{ paste }}" style="height:44px;padding:0 16px;border:0;border-radius:22px;background:#E3F1E8;color:#1F5C3E;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;flex:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="5" width="12" height="16" rx="2.5"/><path d="M9.5 5V4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1"/></svg>
        Pegar
      </button>
    </div>
    <sc-if value="{{ invalid }}" hint-placeholder-val="{{ true }}">
      <div id="error-codigo" role="alert" style="display:flex;align-items:flex-start;gap:8px;padding:0 4px;color:#A12D2D;font-size:14px;font-weight:700;line-height:1.4">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:0"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>
        <span>Este código no existe o ya venció. Revisalo o pedí uno nuevo.</span>
      </div>
    </sc-if>
  </div>

  <div style="flex:1"></div>

  <div style="padding:0 24px 40px">
    <sc-if value="{{ hasCode }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ tryJoin }}" style="width:100%;height:56px;border:0;border-radius:28px;background:#2E7D57;color:#fff;font-size:17px;font-weight:700;cursor:pointer">Unirme</button>
    </sc-if>
    <sc-if value="{{ noCode }}" hint-placeholder-val="{{ false }}">
      <button disabled style="width:100%;height:56px;border:0;border-radius:28px;background:#E4E8DF;color:#5B675F;font-size:17px;font-weight:700">Unirme</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(...args) {
super(...args);
this.state = { code: 'K7P2-9XQ-4MM', invalid: true };
}
renderVals() {
const s = this.state;
const has = s.code.trim().length > 0;
return {
code: s.code,
invalid: s.invalid,
hasCode: has,
noCode: !has,
border: s.invalid ? '2px solid #A12D2D' : '1.5px solid #D5DAD0',
fieldBg: s.invalid ? '#FFF8F8' : '#fff',
labelColor: s.invalid ? '#A12D2D' : '#5B675F',
onCode: (e) => this.setState({ code: e.target.value, invalid: false }),
paste: () => this.setState({ code: 'K7P2-9XQ-4MN', invalid: false }),
tryJoin: () => this.setState({ invalid: true })
};
}
}
</script>
</body>
</html>
