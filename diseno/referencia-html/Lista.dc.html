<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
input::placeholder{color:#5B675F;opacity:1}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2E7D57;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F7F8F3;font-family:'DM Sans',system-ui,sans-serif;color:#1C2621;display:flex;flex-direction:column;position:relative;overflow:hidden">
  <div style="padding:48px 16px 0 8px;display:flex;align-items:center;gap:4px">
    <a href="SalirLista.dc.html" aria-label="Volver a las listas" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex:1;min-width:0">
      <h1 style="margin:0;font-family:Nunito,sans-serif;font-weight:800;font-size:24px;line-height:1.1">Supermercado</h1>
      <div style="font-size:13px;color:#5B675F;margin-top:2px">Nuestra casa</div>
    </div>
    <sc-if value="{{ online }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ toggleOffline }}" aria-label="Estado: sincronizado. Tocá para simular que no hay conexión" style="height:44px;padding:0 14px 0 12px;border:0;border-radius:22px;background:#E3F1E8;color:#1F5C3E;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 1 1 .8-8.9A6 6 0 0 1 19 11.5 3.3 3.3 0 0 1 18 18z"/><path d="M9.5 13.5l2 2 3.5-4"/></svg>
        Sincronizado
      </button>
    </sc-if>
    <sc-if value="{{ offline }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleOffline }}" aria-label="Estado: sin conexión. Tocá para simular que volvió la conexión" style="height:44px;padding:0 14px 0 12px;border:0;border-radius:22px;background:#FCEBCB;color:#7A4300;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 1 1 .8-8.9A6 6 0 0 1 19 11.5 3.3 3.3 0 0 1 18 18z"/><path d="M4 4l16 16"/></svg>
        Sin conexión
      </button>
    </sc-if>
  </div>

  <sc-if value="{{ offline }}" hint-placeholder-val="{{ false }}">
    <div style="margin:8px 20px 0;padding:10px 14px;border-radius:14px;background:#FCEBCB;color:#7A4300;font-size:13px;line-height:1.4">Los cambios se guardan en tu celular y se sincronizan cuando vuelva la conexión.</div>
  </sc-if>

  <form onSubmit="{{ submit }}" style="margin:14px 20px 8px;display:flex;align-items:center;gap:10px">
    <label for="nuevo-item" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Agregar ítem</label>
    <input id="nuevo-item" type="text" value="{{ draft }}" onInput="{{ onDraft }}" placeholder="Agregar ítem…" autocomplete="off" style="flex:1;min-width:0;height:52px;box-sizing:border-box;padding:0 20px;border:1.5px solid #D5DAD0;border-radius:26px;background:#fff;font-family:inherit;font-size:17px;color:#1C2621">
    <button type="submit" aria-label="Agregar a la lista" style="width:52px;height:52px;border:0;border-radius:50%;background:#2E7D57;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </form>

  <div style="flex:1;overflow-y:auto;padding:4px 20px 28px">
    <div style="display:flex;align-items:baseline;gap:8px;padding:8px 4px">
      <h2 style="margin:0;font-size:15px;font-weight:700;color:#1C2621">Pendientes</h2>
      <span style="font-size:15px;font-weight:700;color:#5B675F">{{ pendingCount }}</span>
    </div>
    <div style="border-radius:20px;overflow:hidden;background:#EEF1EA;display:flex;flex-direction:column;gap:1px">
      <sc-for list="{{ pending }}" as="item" hint-placeholder-count="7">
        <div style="display:flex;align-items:center;gap:4px;height:56px;padding:0 16px 0 6px;background:#fff">
          <button onClick="{{ item.toggle }}" aria-label="Marcar como comprado" style="width:44px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none">
            <span style="width:24px;height:24px;border-radius:50%;border:2px solid #7C8A82;box-sizing:border-box;display:block"></span>
          </button>
          <a href="Detalle.dc.html" style="flex:1;min-width:0;height:56px;display:flex;align-items:center;gap:8px">
            <span style="font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ item.name }}</span>
            <span style="font-size:14px;color:#5B675F;white-space:nowrap">{{ item.qty }}</span>
          </a>
          <sc-if value="{{ item.isV }}" hint-placeholder-val="{{ false }}">
            <span role="img" aria-label="Vos" style="width:28px;height:28px;border-radius:50%;background:#CFE8D9;color:#1F5C3E;font:800 13px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">V</span>
          </sc-if>
          <sc-if value="{{ item.isL }}" hint-placeholder-val="{{ false }}">
            <span role="img" aria-label="Lucía" style="width:28px;height:28px;border-radius:50%;background:#F8DDAE;color:#7A4300;font:800 13px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">L</span>
          </sc-if>
          <sc-if value="{{ item.isD }}" hint-placeholder-val="{{ false }}">
            <span role="img" aria-label="Diego" style="width:28px;height:28px;border-radius:50%;background:#CFE0F2;color:#1D4E75;font:800 13px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">D</span>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{ hasDone }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:baseline;gap:8px;padding:24px 4px 8px">
        <h2 style="margin:0;font-size:15px;font-weight:700;color:#5B675F">Comprados</h2>
        <span style="font-size:15px;font-weight:700;color:#5B675F">{{ doneCount }}</span>
      </div>
      <div style="border-radius:20px;overflow:hidden;background:#EEF1EA;display:flex;flex-direction:column;gap:1px">
        <sc-for list="{{ done }}" as="item" hint-placeholder-count="3">
          <div style="display:flex;align-items:center;gap:4px;height:52px;padding:0 16px 0 6px;background:#fff">
            <button onClick="{{ item.toggle }}" aria-label="Volver a pendientes" style="width:44px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none">
              <span style="width:24px;height:24px;border-radius:50%;background:#2E7D57;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
            </button>
            <a href="Detalle.dc.html" style="flex:1;min-width:0;height:52px;display:flex;align-items:center;gap:8px">
              <span style="font-size:17px;color:#5B675F;text-decoration:line-through;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ item.name }}</span>
              <span style="font-size:14px;color:#5B675F;white-space:nowrap">{{ item.qty }}</span>
            </a>
            <sc-if value="{{ item.isV }}" hint-placeholder-val="{{ false }}">
              <span role="img" aria-label="Vos" style="width:28px;height:28px;border-radius:50%;background:#CFE8D9;color:#1F5C3E;font:800 13px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">V</span>
            </sc-if>
            <sc-if value="{{ item.isL }}" hint-placeholder-val="{{ false }}">
              <span role="img" aria-label="Lucía" style="width:28px;height:28px;border-radius:50%;background:#F8DDAE;color:#7A4300;font:800 13px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">L</span>
            </sc-if>
            <sc-if value="{{ item.isD }}" hint-placeholder-val="{{ false }}">
              <span role="img" aria-label="Diego" style="width:28px;height:28px;border-radius:50%;background:#CFE0F2;color:#1D4E75;font:800 13px/1 Nunito,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">D</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(...args) {
super(...args);
this.state = {
draft: '',
offline: false,
items: [
{ id: 1, name: 'Leche', qty: '×2', by: 'L', done: false },
{ id: 2, name: 'Pan lactal', qty: '', by: 'V', done: false },
{ id: 3, name: 'Yerba mate', qty: '1 kg', by: 'V', done: false },
{ id: 4, name: 'Huevos', qty: '1 docena', by: 'D', done: false },
{ id: 5, name: 'Fideos', qty: '×3', by: 'L', done: false },
{ id: 6, name: 'Aceite de girasol', qty: '', by: 'D', done: false },
{ id: 7, name: 'Papel higiénico', qty: '1 pack', by: 'V', done: false },
{ id: 8, name: 'Arroz', qty: '', by: 'D', done: true },
{ id: 9, name: 'Detergente', qty: '', by: 'V', done: true },
{ id: 10, name: 'Café', qty: '', by: 'L', done: true }
]
};
}
toggle(id) {
this.setState({ items: this.state.items.map((i) => (i.id === id ? { ...i, done: !i.done } : i)) });
}
renderVals() {
const { items, draft, offline } = this.state;
const decorate = (it) => ({
...it,
isV: it.by === 'V',
isL: it.by === 'L',
isD: it.by === 'D',
toggle: () => this.toggle(it.id)
});
const pending = items.filter((i) => !i.done).map(decorate);
const done = items.filter((i) => i.done).map(decorate);
return {
pending,
done,
pendingCount: pending.length,
doneCount: done.length,
hasDone: done.length > 0,
draft,
offline,
online: !offline,
onDraft: (e) => this.setState({ draft: e.target.value }),
submit: (e) => {
e.preventDefault();
const t = this.state.draft.trim();
if (!t) return;
this.setState({ items: [{ id: Date.now(), name: t, qty: '', by: 'V', done: false }, ...this.state.items], draft: '' });
},
toggleOffline: () => this.setState({ offline: !this.state.offline })
};
}
}
</script>
</body>
</html>
