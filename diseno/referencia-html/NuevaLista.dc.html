<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nueva lista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
input::placeholder{color:#5B675F;opacity:1}
@keyframes subir{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes velo{from{opacity:0}to{opacity:1}}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #2E7D57;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F7F8F3;font-family:'DM Sans',system-ui,sans-serif;color:#1C2621;position:relative;overflow:hidden">

  <div aria-hidden="true" style="position:absolute;inset:0;display:flex;flex-direction:column">
    <div style="padding:56px 24px 8px">
      <div style="font-size:15px;font-weight:700;color:#5B675F">Nuestra casa</div>
      <div style="font-family:Nunito,sans-serif;font-weight:800;font-size:34px;line-height:1.1">Listas</div>
    </div>
    <div style="padding:16px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px">
      <div style="height:172px;border-radius:24px;background:#E3F1E8"></div>
      <div style="height:172px;border-radius:24px;background:#FCEBCB"></div>
      <div style="height:172px;border-radius:24px;background:#DDEBF7"></div>
      <div style="height:172px;border-radius:24px;background:#ECEEE8"></div>
    </div>
  </div>

  <a href="Inicio.dc.html" aria-label="Cerrar" style="position:absolute;inset:0;background:rgba(28,38,33,0.5);animation:velo 0.25s ease-out both"></a>

  <div role="dialog" aria-label="Nueva lista" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:0 24px 28px;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -8px 30px rgba(28,38,33,0.18);animation:subir 0.35s cubic-bezier(0.2,0.8,0.2,1) both;display:flex;flex-direction:column">
    <div style="width:36px;height:4px;border-radius:2px;background:#C9D0C9;margin:10px auto 6px"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;height:48px">
      <h1 style="margin:0;font-family:Nunito,sans-serif;font-weight:800;font-size:20px">Nueva lista</h1>
      <a href="Inicio.dc.html" aria-label="Cerrar" style="width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:#5B675F">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
    </div>

    <label for="nombre-lista" style="font-size:13px;font-weight:700;color:#5B675F;margin:8px 0 6px">Nombre</label>
    <input id="nombre-lista" type="text" placeholder="Por ejemplo: Panadería" autocomplete="off" style="height:52px;box-sizing:border-box;padding:0 16px;border:1.5px solid #D5DAD0;border-radius:14px;background:#F7F8F3;font-family:inherit;font-size:18px;font-weight:500;color:#1C2621">

    <div id="lbl-color" style="font-size:13px;font-weight:700;color:#5B675F;margin:20px 0 10px">Color</div>
    <div role="group" aria-labelledby="lbl-color" style="display:flex;gap:14px">
      <sc-for list="{{ swatches }}" as="s" hint-placeholder-count="4">
        <button onClick="{{ s.pick }}" aria-label="{{ s.label }}" aria-pressed="{{ s.selected }}" style="{{ s.style }}">
          <sc-if value="{{ s.selected }}" hint-placeholder-val="{{ false }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2621" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <a href="Inicio.dc.html" style="margin-top:28px;height:56px;border-radius:28px;background:#2E7D57;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center">Crear lista</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(...args) {
super(...args);
this.state = { color: 'verde' };
}
renderVals() {
const opts = [
{ id: 'verde', label: 'Verde', bg: '#9ED3B3' },
{ id: 'ambar', label: 'Ámbar', bg: '#F2C26B' },
{ id: 'azul', label: 'Azul', bg: '#9CC4E8' },
{ id: 'gris', label: 'Gris', bg: '#C9D0C9' }
];
const swatches = opts.map((o) => {
const selected = this.state.color === o.id;
return {
label: o.label,
selected,
pick: () => this.setState({ color: o.id }),
style: 'width:48px;height:48px;border-radius:50%;box-sizing:border-box;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:' + o.bg + ';border:3px solid ' + (selected ? '#1C2621' : 'transparent') + ';'
};
});
return { swatches };
}
}
</script>
</body>
</html>
